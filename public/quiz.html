<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinalize | Quiz</title>

    <script src="./js/sinais.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/imgs/sinalize-mao.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="header">
        <div class="container">
            <a class="marca" href="index.html">
                <img src="assets/imgs/sinalize-mao.png" alt="Mão fazendo a letra S em Libras">
                <h1 class="titulo">Sinalize</h1>
            </a>
            <ul class="navbar">
                <li>
                    <a href="index.html">Início</a>
                </li>
                <li>
                    <a href="aprenda.html">Aprenda</a>
                </li>
                <li class="agora">
                    <a href="quiz.html?tema=alfabeto">Quiz</a>
                </li>
                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>
                <li class="usuario">
                    <span class="avatar" id="span_inicial"></span>
                    <span>Olá, <b id="b_usuario"></b></span>
                </li>
                <li>
                    <a class="sair" href="#" onclick="sair()">Sair</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="pagina-quiz">
        <div class="container">

            <div class="quiz-topo">
                <h2 id="h2_titulo"></h2>
                <p id="p_subtitulo"></p>
            </div>

            <!-- Tela 1: escolha do modo -->
            <div id="div_modos">
                <div class="modos-quiz">
                    <button class="modo-quiz" onclick="escolherModo('sinal')">
                        <strong>Qual é a letra?</strong>
                        <span>Você vê o sinal e escolhe a letra certa entre 4 opções.</span>
                        <small>Bom para começar</small>
                    </button>
                    <button class="modo-quiz" onclick="escolherModo('invertido')">
                        <strong>Qual é o sinal?</strong>
                        <span>Você vê a letra e escolhe o sinal certo entre 4 fotos.</span>
                        <small>Mais difícil</small>
                    </button>
                </div>
            </div>

            <!-- Tela 2: as perguntas (preenchida pelo JavaScript) -->
            <div class="cartao-quiz" id="div_jogo" style="display: none"></div>

        </div>
    </div>

    <div class="footer">
        <div class="container">
            <h4>Sinalize &middot; Thiago Prado &middot; SPTech &copy; 2026</h4>
        </div>
    </div>
</body>

</html>

<script>
    // 1. Só quem fez login pode fazer o quiz (a tentativa é salva no nome do usuário)
    var nomeUsuario = sessionStorage.NOME_USUARIO;

    if (nomeUsuario == undefined) {
        window.location = "login.html";
    } else {
        b_usuario.innerHTML = nomeUsuario;
        span_inicial.innerHTML = nomeUsuario[0].toUpperCase();
    }

    // 2. Lê o tema que veio no endereço: quiz.html?tema=alfabeto
    var parametros = new URLSearchParams(window.location.search);
    var tema = parametros.get("tema");

    // 3. Escolhe o vetor de sinais do tema. Por enquanto só o alfabeto tem fotos gravadas.
    var sinaisDoTema = [];

    if (tema == "alfabeto") {
        sinaisDoTema = alfabeto;   // vetor do js/sinais.js
        h2_titulo.innerHTML = "Quiz do alfabeto";
        p_subtitulo.innerHTML = `10 perguntas sorteadas entre as ${alfabeto.length} letras. Escolha o modo:`;
    } else {
        // Tema que não existe ou que ainda não tem fotos: volta para a escolha de temas
        h2_titulo.innerHTML = "Tema não encontrado";
        p_subtitulo.innerHTML = 'Esse tema ainda não está disponível. <a href="index.html#temas">Escolha outro tema</a>.';
        div_modos.style.display = "none";
    }

    var TOTAL_PERGUNTAS = 10;

    var modo = "";          // "sinal" = vê o sinal e escolhe a letra | "invertido" = vê a letra e escolhe o sinal
    var perguntas = [];     // os 10 sinais sorteados
    var atual = 0;          // posição da pergunta atual no vetor de perguntas
    var acertos = 0;
    var respostas = [];     // cada resposta: { sinal: "A", acertou: true }
    var opcoesAtuais = [];  // as 4 opções da pergunta atual
    var respondeu = false;  // impede responder duas vezes a mesma pergunta

    // 4. Guarda o modo escolhido, troca a tela de modos pela de perguntas e começa o quiz
    function escolherModo(modoEscolhido) {
        modo = modoEscolhido;

        if (modo == "sinal") {
            p_subtitulo.innerHTML = "Modo: Qual é a letra?";
        } else {
            p_subtitulo.innerHTML = "Modo: Qual é o sinal?";
        }

        div_modos.style.display = "none";
        div_jogo.style.display = "flex";
        iniciarQuiz();
    }

    function iniciarQuiz() {
        perguntas = sortearPerguntas(TOTAL_PERGUNTAS);
        atual = 0;
        acertos = 0;
        respostas = [];
        mostrarPergunta();
    }

    // 5. Sorteia sinais do tema sem repetir
    function sortearPerguntas(quantidade) {
        var sorteadas = [];
        while (sorteadas.length < quantidade) {
            // Math.random() dá um número entre 0 e 1; vezes o tamanho do vetor vira uma posição
            var posicao = Math.floor(Math.random() * sinaisDoTema.length);
            if (sorteadas.indexOf(sinaisDoTema[posicao]) == -1) {
                sorteadas.push(sinaisDoTema[posicao]);
            }
        }
        return sorteadas;
    }

    // 6. Monta as 4 opções: a certa + 3 sorteadas diferentes dela, depois embaralha
    function montarOpcoes(certa) {
        var opcoes = [certa];
        while (opcoes.length < 4) {
            var posicao = Math.floor(Math.random() * sinaisDoTema.length);
            if (opcoes.indexOf(sinaisDoTema[posicao]) == -1) {
                opcoes.push(sinaisDoTema[posicao]);
            }
        }

        // Embaralha: troca cada posição com outra sorteada, para a certa não ficar sempre em 1º
        for (var i = 0; i < opcoes.length; i++) {
            var j = Math.floor(Math.random() * opcoes.length);
            var guardada = opcoes[i];
            opcoes[i] = opcoes[j];
            opcoes[j] = guardada;
        }
        return opcoes;
    }

    // 7. Mostra a pergunta atual: barra de progresso, o que perguntar e as 4 opções
    function mostrarPergunta() {
        respondeu = false;
        var certa = perguntas[atual];
        opcoesAtuais = montarOpcoes(certa);

        var porcentagemFeita = (atual / TOTAL_PERGUNTAS) * 100;

        var html = `
            <div class="progresso-quiz">
                <span>Pergunta ${atual + 1} de ${TOTAL_PERGUNTAS}</span>
                <div class="barrinha"><div style="width: ${porcentagemFeita}%"></div></div>
                <span class="placar">${acertos} acerto(s)</span>
            </div>`;

        if (modo == "sinal") {
            html += `<p class="pergunta">Qual letra é este sinal?</p>
                     <div class="sinal-grande">${htmlDoSinal(certa)}</div>`;
        } else {
            html += `<p class="pergunta">Qual destes é o sinal da letra?</p>
                     <div class="letra-grande">${certa.nome}</div>`;
        }

        html += `<div class="opcoes">`;
        for (var i = 0; i < opcoesAtuais.length; i++) {
            // No modo "sinal" a opção é a letra; no modo "invertido" é a foto/vídeo
            var conteudo = opcoesAtuais[i].nome;
            if (modo == "invertido") {
                conteudo = htmlDoSinal(opcoesAtuais[i]);
            }
            html += `<button class="opcao" id="opcao_${i}" onclick="responder(${i})">${conteudo}</button>`;
        }
        html += `</div>
                 <div id="div_retorno"></div>
                 <div class="acoes-quiz" id="div_acoes"></div>`;

        div_jogo.innerHTML = html;
    }

    // 8. Confere a resposta, pinta as opções e guarda o resultado da pergunta
    function responder(indice) {
        if (respondeu) {
            return;
        }
        respondeu = true;

        var certa = perguntas[atual];
        var escolhida = opcoesAtuais[indice];
        var acertou = escolhida.nome == certa.nome;

        if (acertou) {
            acertos++;
        }
        respostas.push({ sinal: certa.nome, acertou: acertou });

        // Verde na opção certa; vermelho na escolhida, se estiver errada
        for (var i = 0; i < opcoesAtuais.length; i++) {
            var botao = document.getElementById(`opcao_${i}`);
            botao.disabled = true;
            if (opcoesAtuais[i].nome == certa.nome) {
                botao.classList.add("certa");
            } else if (i == indice) {
                botao.classList.add("errada");
            }
        }

        if (acertou) {
            div_retorno.innerHTML = `<p class="retorno certo">Isso! É a letra ${certa.nome}.</p>`;
        } else {
            div_retorno.innerHTML = `<p class="retorno erro">Quase! A resposta certa é a letra ${certa.nome}.</p>`;
        }

        var textoBotao = "Próxima";
        if (atual == TOTAL_PERGUNTAS - 1) {
            textoBotao = "Ver resultado";
        }
        div_acoes.innerHTML = `<button class="botao-redondo botao-cheio" onclick="proxima()">${textoBotao}</button>`;
    }

    // 9. Vai para a próxima pergunta ou, depois da última, para o resultado
    function proxima() {
        atual++;
        if (atual < TOTAL_PERGUNTAS) {
            mostrarPergunta();
        } else {
            mostrarResultado();
        }
    }

    // Resultado simples por enquanto; a tela completa entra na parte 3
    function mostrarResultado() {
        div_jogo.innerHTML = `<p class="pergunta">Fim! Você acertou ${acertos} de ${TOTAL_PERGUNTAS}.</p>`;
    }

    // Apaga os dados do login e volta para a Home como visitante
    function sair() {
        sessionStorage.clear();
        window.location = "index.html";
    }
</script>
