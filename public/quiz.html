<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sinalize | Quiz</title>

    <script src="./js/sinais.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/imgs/sinalize-mao.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body>
    <div class="header">
        <div class="container">
            <a class="marca" href="index.html">
                <img src="assets/imgs/sinalize-mao.png" alt="Mão fazendo a letra S em Libras">
                <h1 class="titulo">Sinalize</h1>
            </a>
            <ul class="navbar">
                <li>
                    <a href="index.html">Início</a>
                </li>
                <li>
                    <a href="aprenda.html">Aprenda</a>
                </li>
                <li class="agora">
                    <a href="quiz.html?tema=alfabeto">Quiz</a>
                </li>
                <li>
                    <a href="dashboard.html">Dashboard</a>
                </li>
                <li class="usuario">
                    <span class="avatar" id="span_inicial"></span>
                    <span>Olá, <b id="b_usuario"></b></span>
                </li>
                <li>
                    <a class="sair" href="#" onclick="sair()">Sair</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="pagina-quiz">
        <div class="container">

            <div class="quiz-topo">
                <h2 id="h2_titulo"></h2>
                <p id="p_subtitulo"></p>
            </div>

            <!-- Tela 1: escolha do modo -->
            <div id="div_modos">
                <div class="modos-quiz">
                    <button class="modo-quiz" onclick="escolherModo('sinal')">
                        <strong id="strong_modo_sinal">Qual é a letra?</strong>
                        <span id="span_modo_sinal">Você vê o sinal e escolhe a letra certa entre 4 opções.</span>
                        <small>Bom para começar</small>
                    </button>
                    <button class="modo-quiz" onclick="escolherModo('invertido')">
                        <strong>Qual é o sinal?</strong>
                        <span id="span_modo_invertido">Você vê a letra e escolhe o sinal certo entre 4 opções.</span>
                        <small>Mais difícil</small>
                    </button>
                </div>
            </div>

            <!-- Tela 2: as perguntas (preenchida pelo JavaScript) -->
            <div class="cartao-quiz" id="div_jogo" style="display: none"></div>

        </div>
    </div>

    <div class="footer">
        <div class="container">
            <h4>Sinalize &middot; Thiago Prado &middot; SPTech &copy; 2026</h4>
        </div>
    </div>
</body>

</html>

<script>
    // 1. Só quem fez login pode fazer o quiz (a tentativa é salva no nome do usuário)
    var nomeUsuario = sessionStorage.NOME_USUARIO;

    if (nomeUsuario == undefined) {
        window.location = "login.html";
    } else {
        b_usuario.innerHTML = nomeUsuario;
        span_inicial.innerHTML = nomeUsuario[0].toUpperCase();
    }

    // 2. Lê o tema que veio no endereço: quiz.html?tema=alfabeto
    var parametros = new URLSearchParams(window.location.search);
    var tema = parametros.get("tema");

    // 3. Busca as informações do tema no objeto "temas" do js/sinais.js
    //    (título, vetor de sinais e como chamar os itens: "letras", "números" ou "sinais")
    var dadosTema = temas[tema];
    var sinaisDoTema = [];
    var TOTAL_PERGUNTAS = 10;

    // Nome do modo "sinal" de acordo com o tema: letra, número ou significado
    var nomeModoSinal = "O que significa?";
    if (tema == "alfabeto") {
        nomeModoSinal = "Qual é a letra?";
    } else if (tema == "numeros") {
        nomeModoSinal = "Qual é o número?";
    }

    if (dadosTema == undefined) {
        // Tema que não existe no endereço: volta para a escolha de temas
        h2_titulo.innerHTML = "Tema não encontrado";
        p_subtitulo.innerHTML = 'Esse tema não existe. <a href="index.html#temas">Escolha um tema</a>.';
        div_modos.style.display = "none";
    } else {
        sinaisDoTema = dadosTema.sinais;

        // Temas com menos de 10 sinais fazem uma pergunta por sinal
        if (sinaisDoTema.length < TOTAL_PERGUNTAS) {
            TOTAL_PERGUNTAS = sinaisDoTema.length;
        }

        h2_titulo.innerHTML = `Quiz de ${dadosTema.titulo}`;
        strong_modo_sinal.innerHTML = nomeModoSinal;
        span_modo_sinal.innerHTML = "Você vê o sinal e escolhe o significado certo entre 4 opções.";
        span_modo_invertido.innerHTML = "Você vê o significado e escolhe o sinal certo entre 4 opções.";
        mostrarSubtituloInicial();
    }

    function mostrarSubtituloInicial() {
        p_subtitulo.innerHTML = `${TOTAL_PERGUNTAS} perguntas sorteadas entre ${sinaisDoTema.length} ${dadosTema.itens}. Escolha o modo:`;
    }

    var modo = "";          // "sinal" = vê o sinal e escolhe o significado | "invertido" = vê o significado e escolhe o sinal
    var perguntas = [];     // os 10 sinais sorteados
    var atual = 0;          // posição da pergunta atual no vetor de perguntas
    var acertos = 0;
    var respostas = [];     // cada resposta: { sinal: "A", acertou: true }
    var opcoesAtuais = [];  // as 4 opções da pergunta atual
    var respondeu = false;  // impede responder duas vezes a mesma pergunta

    // 4. Guarda o modo escolhido, troca a tela de modos pela de perguntas e começa o quiz
    function escolherModo(modoEscolhido) {
        modo = modoEscolhido;

        if (modo == "sinal") {
            p_subtitulo.innerHTML = `Modo: ${nomeModoSinal}`;
        } else {
            p_subtitulo.innerHTML = "Modo: Qual é o sinal?";
        }

        div_modos.style.display = "none";
        div_jogo.style.display = "flex";
        iniciarQuiz();
    }

    function iniciarQuiz() {
        perguntas = sortearPerguntas(TOTAL_PERGUNTAS);
        atual = 0;
        acertos = 0;
        respostas = [];
        mostrarPergunta();
    }

    // 5. Sorteia sinais do tema sem repetir
    function sortearPerguntas(quantidade) {
        var sorteadas = [];
        while (sorteadas.length < quantidade) {
            // Math.random() dá um número entre 0 e 1; vezes o tamanho do vetor vira uma posição
            var posicao = Math.floor(Math.random() * sinaisDoTema.length);
            if (sorteadas.indexOf(sinaisDoTema[posicao]) == -1) {
                sorteadas.push(sinaisDoTema[posicao]);
            }
        }
        return sorteadas;
    }

    // 6. Monta as 4 opções: a certa + 3 sorteadas diferentes dela, depois embaralha
    function montarOpcoes(certa) {
        var opcoes = [certa];
        while (opcoes.length < 4) {
            var posicao = Math.floor(Math.random() * sinaisDoTema.length);
            if (opcoes.indexOf(sinaisDoTema[posicao]) == -1) {
                opcoes.push(sinaisDoTema[posicao]);
            }
        }

        // Embaralha: troca cada posição com outra sorteada, para a certa não ficar sempre em 1º
        for (var i = 0; i < opcoes.length; i++) {
            var j = Math.floor(Math.random() * opcoes.length);
            var guardada = opcoes[i];
            opcoes[i] = opcoes[j];
            opcoes[j] = guardada;
        }
        return opcoes;
    }

    // 7. Mostra a pergunta atual: barra de progresso, o que perguntar e as 4 opções
    function mostrarPergunta() {
        respondeu = false;
        var certa = perguntas[atual];
        opcoesAtuais = montarOpcoes(certa);

        var porcentagemFeita = (atual / TOTAL_PERGUNTAS) * 100;

        var html = `
            <div class="progresso-quiz">
                <span>Pergunta ${atual + 1} de ${TOTAL_PERGUNTAS}</span>
                <div class="barrinha"><div style="width: ${porcentagemFeita}%"></div></div>
                <span class="placar">${acertos} acerto(s)</span>
            </div>`;

        if (modo == "sinal") {
            html += `<p class="pergunta">${nomeModoSinal}</p>
                     <div class="sinal-grande">${htmlDoSinal(certa)}</div>`;
        } else {
            // Palavras compridas ("Bom dia") usam uma fonte menor que letras e números
            var classeGrande = "letra-grande";
            if (certa.nome.length > 2) {
                classeGrande = "letra-grande palavra";
            }
            html += `<p class="pergunta">Qual destes é o sinal de...</p>
                     <div class="${classeGrande}">${certa.nome}</div>`;
        }

        html += `<div class="opcoes">`;
        for (var i = 0; i < opcoesAtuais.length; i++) {
            // No modo "sinal" a opção é o significado; no modo "invertido" é a foto/vídeo
            var conteudo = opcoesAtuais[i].nome;
            if (modo == "invertido") {
                conteudo = htmlDoSinal(opcoesAtuais[i]);
            }
            var classeOpcao = "opcao";
            if (modo == "sinal" && opcoesAtuais[i].nome.length > 2) {
                classeOpcao = "opcao palavra";   // fonte menor para palavras
            }
            html += `<button class="${classeOpcao}" id="opcao_${i}" onclick="responder(${i})">${conteudo}</button>`;
        }
        html += `</div>
                 <div id="div_retorno"></div>
                 <div class="acoes-quiz" id="div_acoes"></div>`;

        div_jogo.innerHTML = html;
    }

    // 8. Confere a resposta, pinta as opções e guarda o resultado da pergunta
    function responder(indice) {
        if (respondeu) {
            return;
        }
        respondeu = true;

        var certa = perguntas[atual];
        var escolhida = opcoesAtuais[indice];
        var acertou = escolhida.nome == certa.nome;

        if (acertou) {
            acertos++;
        }
        respostas.push({ sinal: certa.nome, acertou: acertou });

        // Verde na opção certa; vermelho na escolhida, se estiver errada
        for (var i = 0; i < opcoesAtuais.length; i++) {
            var botao = document.getElementById(`opcao_${i}`);
            botao.disabled = true;
            if (opcoesAtuais[i].nome == certa.nome) {
                botao.classList.add("certa");
            } else if (i == indice) {
                botao.classList.add("errada");
            }
        }

        if (acertou) {
            div_retorno.innerHTML = `<p class="retorno certo">Isso! É "${certa.nome}".</p>`;
        } else {
            div_retorno.innerHTML = `<p class="retorno erro">Quase! A resposta certa é "${certa.nome}".</p>`;
        }

        var textoBotao = "Próxima";
        if (atual == TOTAL_PERGUNTAS - 1) {
            textoBotao = "Ver resultado";
        }
        div_acoes.innerHTML = `<button class="botao-redondo botao-cheio" onclick="proxima()">${textoBotao}</button>`;
    }

    // 9. Vai para a próxima pergunta ou, depois da última, para o resultado
    function proxima() {
        atual++;
        if (atual < TOTAL_PERGUNTAS) {
            mostrarPergunta();
        } else {
            mostrarResultado();
        }
    }

    // 10. Tela de resultado: porcentagem, mensagem, sinais para revisar e o que fazer depois
    function mostrarResultado() {
        var porcentagem = (acertos / TOTAL_PERGUNTAS) * 100;

        // Mensagem de acordo com a faixa de acertos
        var mensagem = "";
        if (porcentagem == 100) {
            mensagem = `Perfeito! Você acertou todos os ${dadosTema.itens} desta rodada.`;
        } else if (porcentagem >= 70) {
            mensagem = `Muito bem! Revise só os ${dadosTema.itens} abaixo.`;
        } else if (porcentagem >= 40) {
            mensagem = `Bom começo. Estude os ${dadosTema.itens} que errou e tente de novo.`;
        } else {
            mensagem = `Todo mundo começa assim. Veja os ${dadosTema.itens} abaixo e tente outra rodada.`;
        }

        // Percorre as respostas e monta a foto de cada sinal errado
        var htmlErros = "";
        for (var i = 0; i < respostas.length; i++) {
            if (respostas[i].acertou == false) {
                var sinal = buscarSinal(respostas[i].sinal);   // função do js/sinais.js
                htmlErros += `<div class="letra-errada">${htmlDoSinal(sinal)}<span>${sinal.nome}</span></div>`;
            }
        }

        var html = `
            <div class="resultado-topo">
                <div class="nota">
                    <strong>${porcentagem.toFixed(0)}%</strong>
                    <span>${acertos} de ${TOTAL_PERGUNTAS}</span>
                </div>
                <div class="resultado-texto">
                    <h3>Resultado</h3>
                    <p>${mensagem}</p>
                </div>
            </div>`;

        if (htmlErros != "") {
            html += `<p class="pergunta">Para revisar</p>
                     <div class="letras-erradas">${htmlErros}</div>`;
        }

        html += `
            <p class="salvo" id="p_salvo">Salvando o seu resultado...</p>
            <div class="acoes-resultado">
                <button class="botao-redondo botao-cheio" onclick="iniciarQuiz()">Jogar de novo</button>
                <button class="botao-redondo botao-claro" onclick="trocarModo()">Trocar de modo</button>
                <a class="botao-redondo botao-claro" href="aprenda.html?tema=${tema}">Estudar o tema</a>
                <a class="botao-redondo botao-claro" href="index.html">Voltar ao início</a>
            </div>`;

        div_jogo.innerHTML = html;

        salvarTentativa();
    }

    // 11. Envia a rodada para a API (routes/tentativas.js -> tentativaController -> tentativaModel)
    function salvarTentativa() {
        fetch("/tentativas/registrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                idUsuarioServer: sessionStorage.ID_USUARIO,
                temaServer: tema,
                modoServer: modo,
                acertosServer: acertos,
                totalServer: TOTAL_PERGUNTAS,
                respostasServer: respostas
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                p_salvo.innerHTML = "Resultado salvo! Ele já conta para a sua ofensiva e aparece no seu progresso.";
                p_salvo.classList.add("certo");
            } else {
                throw "Erro ao salvar a tentativa";
            }
        }).catch(function (erro) {
            console.log(erro);
            p_salvo.innerHTML = "Não foi possível salvar este resultado. Confira a conexão e jogue de novo.";
            p_salvo.classList.add("erro");
        });
    }

    // Volta para a tela de escolha do modo
    function trocarModo() {
        div_jogo.style.display = "none";
        div_modos.style.display = "block";
        mostrarSubtituloInicial();
    }

    // Apaga os dados do login e volta para a Home como visitante
    function sair() {
        sessionStorage.clear();
        window.location = "index.html";
    }
</script>
